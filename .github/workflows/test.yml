name: Test formula

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6
        with:
          core: true
          cask: false
      - name: Tap repository
        run: brew tap halilturkoglucs/tap
      - name: Audit formula
        run: brew audit --strict --online halilturkoglucs/tap/air-ir
      - name: Install formula
        run: brew install halilturkoglucs/tap/air-ir
      - name: Test formula
        run: brew test halilturkoglucs/tap/air-ir
